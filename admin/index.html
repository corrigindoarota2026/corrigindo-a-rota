<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Administrativo — Corrigindo a Rota</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='13' y='1' width='6' height='30' fill='%23b8922e' rx='1'/%3E%3Crect x='4' y='9' width='24' height='5' fill='%23b8922e' rx='1'/%3E%3C/svg%3E">

  <!-- 1. Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!-- 2. AVISAR AO EDITOR QUE A CONFIGURAÇÃO É EMBUTIDA (Evita o erro 404) -->
  <script>
    window.CMS_MANUAL_INIT = true;
  </script>
</head>
<body>
  <!-- 3. Decap CMS Engine -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- 4. CONFIGURAÇÃO EMBUTIDA -->
  <script>
    CMS.init({
      config: {
        backend: {
          name: "git-gateway",
          branch: "main",
          identity_url: "https://corrigindoarota.netlify.app/.netlify/identity",
          gateway_url: "https://corrigindoarota.netlify.app/.netlify/git/github"
        },
        media_folder: "static/img",
        public_folder: "/static/img",
        locale: "pt",
        collections: [
          {
            name: "artigos",
            label: "📜 Artigos e Estudos",
            label_singular: "Artigo",
            folder: "content/artigos",
            create: true,
            slug: "{{year}}-{{month}}-{{day}}-{{slug}}",
            fields: [
              { label: "Status", name: "status", widget: "select", options: ["rascunho", "publicado"], default: "rascunho" },
              { label: "Título do Artigo", name: "title", widget: "string" },
              { label: "Resumo (WhatsApp)", name: "description", widget: "text" },
              { label: "Categoria", name: "category", widget: "select", options: ["heresias", "teologia", "manuscritos", "falsos-mestres", "testamento", "vida-crista", "alertas", "pais-igreja", "apologetica"] },
              { label: "Data", name: "date", widget: "datetime" },
              { label: "Tempo de Leitura (min)", name: "reading_time", widget: "number", default: 10 },
              { label: "Imagem de Capa", name: "featured_image", widget: "image", required: false },
              { label: "Corpo do Artigo", name: "body", widget: "markdown" }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
